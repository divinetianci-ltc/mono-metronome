<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>MONO — 极简节拍器</title><style>:root{--bg:#050607;--fg:#f1f3f5;--blue:#609ed2;--line:#26313b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button{font:inherit}.app{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 42%,#101820,#080b0e 30%,#050607 62%);padding:24px clamp(18px,5vw,60px) 20px}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;color:#a9afb5;font-size:11px;font-weight:650;letter-spacing:.28em}.brand i{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 16px #609ed288}.top button{border:0;background:transparent;color:#78818b;padding:8px;cursor:pointer;font-size:12px}.main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:12px 0}.beats{display:flex;gap:10px;height:12px;margin-bottom:clamp(20px,4vh,34px)}.beat{width:7px;height:7px;border-radius:50%;background:#303840;transition:transform .08s,background .08s,box-shadow .08s}.beat.first{box-shadow:0 0 0 2px #609ed266}.beat.on{background:var(--blue);transform:scale(1.65);box-shadow:0 0 18px #609ed2cc}.beat.first.on{box-shadow:0 0 0 3px #609ed277,0 0 20px #609ed2}.readout{position:relative;display:flex;align-items:baseline;justify-content:center;line-height:.75;color:inherit;background:none;border:0;padding:0;cursor:pointer}.bpm{font-size:clamp(84px,18vw,170px);font-weight:560;letter-spacing:-.085em;font-variant-numeric:tabular-nums}.label{position:absolute;left:calc(100% + 16px);bottom:2px;color:#65707a;font-size:10px;white-space:nowrap}.deck{width:min(680px,92vw);display:grid;grid-template-columns:1fr 160px;align-items:center;gap:clamp(30px,7vw,90px);margin-top:clamp(34px,6vh,58px)}.caption{display:block;color:#68727b;font-size:10px;letter-spacing:.13em;text-align:center;margin-bottom:14px}.meters{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}.meters button{height:34px;min-width:0;border:1px solid #202830;border-radius:10px;background:#0b0e11;color:#67717a}.meters button.sel{background:#172634;border-color:var(--blue);color:#b9d8f0}.dialbox{width:160px;justify-self:center}.dial{width:128px;height:128px;margin:auto;position:relative;border-radius:50%;cursor:ns-resize;touch-action:none;background:radial-gradient(circle at 40% 35%,#20272d,#0c1013 55%,#050607 74%);box-shadow:inset 0 0 0 1px #28323b,0 20px 40px #0008}.ring{position:absolute;inset:-7px;border-radius:50%;border:1px solid #263039;border-top-color:#45525e}.needle{position:absolute;inset:8px;border-radius:50%}.needle i{position:absolute;left:50%;top:3px;width:3px;height:14px;border-radius:4px;background:var(--blue);box-shadow:0 0 10px #609ed299;transform:translateX(-50%)}.dialval{position:absolute;inset:0;display:grid;place-items:center;color:#c6ced5;font-size:18px}.range{display:flex;justify-content:space-between;color:#444d55;font-size:9px;margin-top:12px}.actions{display:flex;gap:10px;margin-top:clamp(28px,5vh,44px);flex-wrap:wrap;justify-content:center}.actions button,.confirm{height:48px;padding:0 20px;border-radius:99px;font-size:12px;letter-spacing:.06em;cursor:pointer}.keypad{color:#87929b;background:#0b0e11;border:1px solid #25313b}.gap{width:168px;height:52px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#071019;background:var(--blue);border:0;box-shadow:0 0 0 6px #609ed218,0 10px 28px #0008}.gap strong{font-size:12px;letter-spacing:.12em}.gap small{font-size:9px;letter-spacing:.02em;opacity:.78}.gap.on{color:#d7e8f5;background:#183247;box-shadow:inset 0 0 0 1px #609ed2,0 0 24px #609ed244}.play{width:126px;border:0;background:#edf2f7;color:#071019}.play.on{background:var(--blue)}footer{text-align:center;color:#4b535a;font-size:10px}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:#000a}.pad{width:min(330px,100%);display:grid;gap:14px;border-radius:24px;padding:22px;background:#0c1014;border:1px solid var(--line)}.pad h2,.pad p{margin:0}.pad p{color:#78818b;font-size:11px}.display{height:70px;line-height:70px;text-align:right;padding:0 16px;border-radius:14px;background:#07090b;color:#d7e8f5;font-size:36px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{height:52px;border:1px solid #222c34;border-radius:14px;background:#11171c;color:#d4d9dd;font-size:18px}.confirm{border:0;background:var(--blue);color:#071019}@media(max-width:600px){.app{padding:18px}.main{justify-content:flex-start;padding-top:22px}.bpm{font-size:clamp(88px,31vw,126px)}.label{left:50%;bottom:-25px;transform:translateX(-50%)}.deck{grid-template-columns:1fr;gap:22px;margin-top:50px}.meterbox{order:2}.dialbox{order:1}.dial{width:116px;height:116px}.actions{margin-top:24px}.actions button{height:44px;padding:0 15px}}</style></head><body><div class="app"><header class="top"><div class="brand"><i></i>MONO</div><button id="reset">↻ 重置</button></header><main class="main"><div class="beats" id="beats"></div><button class="readout" id="readout"><span class="bpm" id="bpm">120</span><span class="label">BPM · 点击输入</span></button><div class="deck"><section class="meterbox"><span class="caption">每小节拍数</span><div class="meters" id="meters"></div></section><section class="dialbox"><span class="caption">上下转动调速</span><div class="dial" id="dial" role="slider" aria-label="速度转轮" aria-valuemin="30" aria-valuemax="300" tabindex="0"><span class="ring"></span><span class="needle" id="needle"><i></i></span><span class="dialval" id="dialval">120</span></div><div class="range"><span>30</span><span>300</span></div></section></div><div class="actions"><button class="keypad" id="keypad">数字输入</button><button class="gap" id="gap" aria-pressed="false"><strong>GAP CLICK</strong><small>静音练习 · 节拍继续运行</small></button><button class="play" id="play">▶　开始</button></div></main><footer>Gap Click 静音时节拍仍继续运行</footer></div><div class="overlay" id="overlay" hidden><section class="pad" role="dialog" aria-modal="true"><h2>输入速度</h2><p>请输入 30–300 之间的 BPM</p><output class="display" id="display">120</output><div class="keys" id="keys"></div><button class="confirm" id="confirm">确认</button></section></div><script>let bpm=120,meter=4,playing=false,gapMuted=false,beat=0,ctx,master,timer,next=0,draft='120',dragY,dragBpm;const $=id=>document.getElementById(id),clamp=v=>Math.max(30,Math.min(300,Math.round(v)));function render(){$('bpm').textContent=$('dialval').textContent=bpm;$('needle').style.transform=`rotate(${-135+bpm-30}deg)`;$('dial').setAttribute('aria-valuenow',bpm);$('beats').innerHTML=Array.from({length:meter},(_,i)=>`<i class="beat ${i===0?'first':''} ${playing&&i===beat?'on':''}"></i>`).join('');[...$('meters').children].forEach((b,i)=>b.classList.toggle('sel',i+1===meter))}function tick(t,accent){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=accent?1450:840;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(accent?.48:.18,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+(accent?.085:.048));o.connect(g).connect(master);o.start(t);o.stop(t+(accent?.095:.06))}function schedule(){while(next<ctx.currentTime+.1){let b=beat,t=next;tick(t,b===0);setTimeout(()=>{beat=b;render()},Math.max(0,(t-ctx.currentTime)*1000));beat=(beat+1)%meter;next+=60/bpm}timer=setTimeout(schedule,25)}async function toggle(){if(playing){clearTimeout(timer);playing=false;beat=0;$('play').textContent='▶　开始';$('play').classList.remove('on');render();return}ctx=ctx||new AudioContext();if(!master){master=ctx.createGain();master.gain.value=gapMuted?0:1;master.connect(ctx.destination)}await ctx.resume();beat=0;next=ctx.currentTime+.05;playing=true;$('play').textContent='Ⅱ　暂停';$('play').classList.add('on');schedule()}function openPad(){draft=String(bpm);$('display').textContent=draft;$('overlay').hidden=false}$('meters').innerHTML=Array.from({length:9},(_,i)=>`<button>${i+1}</button>`).join('');[...$('meters').children].forEach((b,i)=>b.onclick=()=>{meter=i+1;beat%=meter;render()});$('keys').innerHTML=['1','2','3','4','5','6','7','8','9','清除','0','⌫'].map(x=>`<button>${x}</button>`).join('');[...$('keys').children].forEach(b=>b.onclick=()=>{let x=b.textContent;if(x==='清除')draft='';else if(x==='⌫')draft=draft.slice(0,-1);else draft=(draft==='0'?x:draft+x).slice(0,3);$('display').textContent=draft||'—'});$('confirm').onclick=()=>{if(draft)bpm=clamp(+draft);$('overlay').hidden=true;render()};$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').hidden=true};$('readout').onclick=$('keypad').onclick=openPad;$('play').onclick=toggle;$('gap').onclick=()=>{gapMuted=!gapMuted;if(master)master.gain.setValueAtTime(gapMuted?0:1,ctx.currentTime);$('gap').classList.toggle('on',gapMuted);$('gap').innerHTML=gapMuted?'<strong>恢复声音</strong><small>节拍仍在运行</small>':'<strong>GAP CLICK</strong><small>静音练习 · 节拍继续运行</small>';$('gap').setAttribute('aria-pressed',gapMuted)};$('reset').onclick=()=>{bpm=120;meter=4;render()};$('dial').onpointerdown=e=>{e.currentTarget.setPointerCapture(e.pointerId);dragY=e.clientY;dragBpm=bpm};$('dial').onpointermove=e=>{if(e.currentTarget.hasPointerCapture(e.pointerId)){bpm=clamp(dragBpm+(dragY-e.clientY)/2);render()}};addEventListener('keydown',e=>{if(!$('overlay').hidden)return;if(e.code==='Space'){e.preventDefault();toggle()}if(['ArrowUp','ArrowRight'].includes(e.key)){bpm=clamp(bpm+1);render()}if(['ArrowDown','ArrowLeft'].includes(e.key)){bpm=clamp(bpm-1);render()}});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();</script></body></html>
