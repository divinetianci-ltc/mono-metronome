<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <title>MONO — 极简节拍器</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#050607;color:#eef4f8;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;display:grid;place-items:center}main{width:min(92vw,430px);padding:28px 18px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;color:#8fa5b5;letter-spacing:.35em;font-size:13px}.top button{background:none;border:1px solid #26333b;color:#9bb4c5;border-radius:999px;padding:8px 12px}.pulse{width:14px;height:14px;background:#293a45;border-radius:50%;margin:42px auto 20px;box-shadow:0 0 0 0 #77b8df}.pulse.on{background:#8bcdf4;box-shadow:0 0 30px 8px #4c9acb88}.bpm{font-size:82px;font-weight:250;line-height:1;letter-spacing:-.06em;cursor:pointer}.unit{color:#7791a2;font-size:12px;letter-spacing:.22em;margin:8px 0 28px}.label{color:#6e8290;font-size:12px;margin:12px}.beats{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}.beats button,.keypad button{border:0;border-radius:10px;background:#10161a;color:#8399a8;padding:11px 0;font-size:15px}.beats button.active{background:#5fa8d3;color:#041017}.wheel{margin:30px auto 10px;width:190px;height:86px;overflow:hidden;touch-action:none;position:relative;background:linear-gradient(#050607,#111a20 45%,#111a20 55%,#050607);border-radius:18px}.wheel div{font-size:32px;line-height:86px;color:#9fd5f3;user-select:none}.range{display:flex;justify-content:space-between;color:#42535e;font-size:11px;width:190px;margin:auto}.actions{display:flex;gap:12px;margin-top:25px}.actions button{flex:1;border:1px solid #263640;border-radius:16px;background:#0d1317;color:#a7c0d1;padding:17px;font-size:16px}.actions .play{background:#6db2dc;color:#061016;border:0}.hint{color:#41515b;font-size:11px;margin-top:22px}.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center}.modal.show{display:grid}.panel{background:#0b1013;border:1px solid #263640;border-radius:20px;padding:18px;width:min(88vw,310px)}.display{font-size:40px;color:#9fd5f3;height:56px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{padding:16px;font-size:20px}.keypad .ok{background:#6db2dc;color:#061016}.keypad .wide{grid-column:span 2}@media(max-height:650px){.pulse{margin:18px auto}.bpm{font-size:68px}.wheel{margin-top:18px}}
  </style>
</head>
<body>
<main><div class="top"><span>MONO</span><button id="install" hidden>安装</button><button id="reset">↻ 重置</button></div><div id="pulse" class="pulse"></div><div id="bpm" class="bpm" role="button" tabindex="0" aria-label="点击输入速度">120</div><div class="unit">BPM · 点击输入</div><div class="label">每小节拍数</div><div id="beats" class="beats"></div><div class="label">上下转动调速</div><div id="wheel" class="wheel" role="slider" aria-label="速度转轮" aria-valuemin="30" aria-valuemax="300"><div id="wheelValue">120</div></div><div class="range"><span>30</span><span>300</span></div><div class="actions"><button id="number">数字输入</button><button id="play" class="play">▶ 开始</button></div><div class="hint">空格键开始 · 方向键调速</div></main>
<div id="modal" class="modal"><div class="panel"><div id="display" class="display">120</div><div id="keypad" class="keypad"></div></div></div>
<script>
let tempo=120,meter=4,running=false,timer=null,beat=0,audio=null,deferred=null,input='';const $=id=>document.getElementById(id),clamp=n=>Math.max(30,Math.min(300,n));
function paint(){ $('bpm').textContent=tempo;$('wheelValue').textContent=tempo;$('wheel').setAttribute('aria-valuenow',tempo);[...$('beats').children].forEach((b,i)=>b.classList.toggle('active',i+1===meter)); }
function setTempo(n){tempo=clamp(Math.round(n));paint();if(running)start(true)}
function tick(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=beat===0?1200:840;g.gain.setValueAtTime(.28,t);g.gain.exponentialRampToValueAtTime(.001,t+.055);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.06);$('pulse').classList.add('on');setTimeout(()=>$('pulse').classList.remove('on'),65);beat=(beat+1)%meter}
function start(restart=false){clearInterval(timer);if(!restart)running=!running;if(running){beat=0;tick();timer=setInterval(tick,60000/tempo);$('play').textContent='Ⅱ 暂停'}else{$('play').textContent='▶ 开始'}}
for(let i=1;i<=9;i++){const b=document.createElement('button');b.textContent=i;b.onclick=()=>{meter=i;beat=0;paint()};$('beats').append(b)}
function openPad(){input='';$('display').textContent=tempo;$('modal').classList.add('show')}
for(const k of ['1','2','3','4','5','6','7','8','9','清除','0','确定']){const b=document.createElement('button');b.textContent=k;if(k==='清除')b.className='wide';if(k==='确定')b.className='ok';b.onclick=()=>{if(/^\d$/.test(k)){if(input.length<3)input+=k;$('display').textContent=input||tempo}else if(k==='清除'){input='';$('display').textContent='—'}else{if(input)setTempo(+input);$('modal').classList.remove('show')}};$('keypad').append(b)}
let y=0,base=0;$('wheel').addEventListener('pointerdown',e=>{y=e.clientY;base=tempo;$('wheel').setPointerCapture(e.pointerId)});$('wheel').addEventListener('pointermove',e=>{if($('wheel').hasPointerCapture(e.pointerId))setTempo(base+Math.round((y-e.clientY)/3))});$('wheel').addEventListener('wheel',e=>{e.preventDefault();setTempo(tempo-Math.sign(e.deltaY))},{passive:false});
$('play').onclick=()=>start();$('number').onclick=openPad;$('bpm').onclick=openPad;$('reset').onclick=()=>{if(running)start();tempo=120;meter=4;beat=0;paint()};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};document.addEventListener('keydown',e=>{if($('modal').classList.contains('show'))return;if(e.code==='Space'){e.preventDefault();start()}if(e.key==='ArrowUp')setTempo(tempo+1);if(e.key==='ArrowDown')setTempo(tempo-1)});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});$('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');paint();
  </script>
</body></html>
